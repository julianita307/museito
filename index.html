<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo del Cristal Encantado</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>
    // Mantiene al visitante dentro de la sala y fuera del cristal, estatuas y pedestal del libro
    AFRAME.registerComponent('room-bounds', {
      init: function () { this.obs = [[0, 0, 2.8], [-3.2, -4.2, 1], [3.2, -4.2, 1], [5.25, 0, 0.9], [-4.6, -5.5, 1.1], [4.75, -5.6, 0.9], [-5.6, 4.2, 1.1], [5.6, 4.2, 1.1]]; },
      tick: function () {
        var p = this.el.object3D.position;
        p.x = Math.max(-5.4, Math.min(5.4, p.x));
        p.z = Math.max(-5.4, Math.min(5.4, p.z));
        this.obs.forEach(function (o) {
          var dx = p.x - o[0], dz = p.z - o[1], d = Math.hypot(dx, dz);
          if (d < o[2] && d > 0.001) { p.x = o[0] + dx / d * o[2]; p.z = o[1] + dz / d * o[2]; }
        });
      }
    });

    // Caminar con el joystick izquierdo en VR (en PC se usa WASD)
    AFRAME.registerComponent('thumbstick-move', {
      init: function () {
        var s = this; this.v = { x: 0, y: 0 };
        this.el.addEventListener('thumbstickmoved', function (e) { s.v = e.detail; });
        this.cam = document.querySelector('[camera]').object3D;
        this.rig = document.querySelector('#rig').object3D;
      },
      tick: function (t, dt) {
        if (Math.abs(this.v.x) < 0.15 && Math.abs(this.v.y) < 0.15) return;
        var yaw = this.cam.getWorldQuaternion(new THREE.Quaternion());
        yaw = new THREE.Euler().setFromQuaternion(yaw, 'YXZ').y;
        var k = 2 * dt / 1000;
        this.rig.position.x += (Math.cos(yaw) * this.v.x + Math.sin(yaw) * this.v.y) * k;
        this.rig.position.z += (-Math.sin(yaw) * this.v.x + Math.cos(yaw) * this.v.y) * k;
      }
    });
    </script>
    <script>
    // 1) Cristal: gira sobre su eje vertical, de forma continua (grados por segundo)
    AFRAME.registerComponent('girar', {
      schema: { velocidad: { default: 20 } },
      tick: function (t, dt) {
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.data.velocidad) * Math.min(dt, 100) / 1000;
      }
    });

    // 2) Cuadros: se expanden suavemente mientras alguien los mira (mirada de la cámara o láser del mando)
    AFRAME.registerComponent('mirar-expandir', {
      schema: { escala: { default: 1.2 }, avance: { default: 0.08 }, velocidad: { default: 6 } },
      init: function () {
        var self = this, el = this.el;
        this.p = 0;          // progreso de la animación: 0 = tamaño original, 1 = expandido
        this.mirando = 0;    // cuántos rayos (mirada/mandos) apuntan al cuadro
        this.base = null;
        el.querySelectorAll('.mirable').forEach(function (hijo) {
          hijo.addEventListener('mouseenter', function () { self.mirando++; });
          hijo.addEventListener('mouseleave', function () { self.mirando = Math.max(0, self.mirando - 1); });
        });
        // borde luminoso discreto detrás del marco (invisible hasta que se mira)
        var caja = el.querySelector('a-box');
        this.halo = document.createElement('a-plane');
        this.halo.setAttribute('width', (parseFloat(caja.getAttribute('width')) || 1) + 0.2);
        this.halo.setAttribute('height', (parseFloat(caja.getAttribute('height')) || 1) + 0.2);
        this.halo.setAttribute('position', '0 0 -0.032');
        this.halo.setAttribute('material', 'shader: flat; color: #ffd08a; transparent: true; opacity: 0');
        el.appendChild(this.halo);
      },
      tick: function (t, dt) {
        var o = this.el.object3D;
        if (!this.base) {
          this.base = { pos: o.position.clone(), esc: o.scale.clone(), dir: new THREE.Vector3(0, 0, 1).applyQuaternion(o.quaternion) };
        }
        var meta = this.mirando > 0 ? 1 : 0;
        if (this.p === meta) return;
        this.p += (meta - this.p) * (1 - Math.exp(-this.data.velocidad * Math.min(dt, 100) / 1000));
        if (Math.abs(meta - this.p) < 0.002) this.p = meta;
        o.scale.copy(this.base.esc).multiplyScalar(1 + (this.data.escala - 1) * this.p);
        o.position.copy(this.base.pos).addScaledVector(this.base.dir, this.data.avance * this.p);
        var malla = this.halo.getObject3D('mesh');
        if (malla) malla.material.opacity = 0.55 * this.p;
      }
    });

    // 3) Audio ambiental: suena en bucle y se inicia con el botón "Entrar al museo" o al entrar en VR
    window.addEventListener('DOMContentLoaded', function () {
      var audio = document.querySelector('#musica'), boton = document.querySelector('#boton-entrar');
      audio.volume = 0.35;
      function iniciar() {
        boton.style.display = 'none';
        if (!audio.paused) return;   // una sola reproducción a la vez
        audio.play().catch(function () { boton.style.display = 'block'; });   // si el navegador lo bloquea, vuelve el botón
      }
      boton.addEventListener('click', iniciar);
      document.querySelector('a-scene').addEventListener('enter-vr', iniciar);
    });
    </script>
</head>
